<!DOCTYPE html>
<html lang="{{PAGE_LANGUAGE}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-blog-title="{{TITLE}} | [owner]'s Blog">{{TITLE}} | simonc site</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="../src/css/styles.css?v=20260313b">
    <script src="../src/js/site-config.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/article-groups.js"></script>
    <script src="../src/js/load-nav.js"></script>
    <script src="../src/js/dark-mode.js"></script>
    <script src="../src/js/toc-generator.js"></script>
    <script src="../src/js/progress-bar.js"></script>
    <script src="../src/js/back-to-top.js"></script>
    <script src="../src/js/mobile-scroll-ui.js"></script>
    <script src="../src/js/load-backlinks.js"></script>
    <script src="../src/js/load-post-series.js"></script>
</head>
<body class="article-page" data-article-group="{{ARTICLE_GROUP_ID}}" data-article-language="{{ARTICLE_LANGUAGE}}" data-article-en-file="{{ARTICLE_EN_FILE}}" data-article-zh-file="{{ARTICLE_ZH_FILE}}">
    <header class="site-header">
        <div class="header-inner">
            <p class="site-kicker" data-i18n="article">Article</p>
            <h1 data-site-title>simonc site</h1>
            <p class="site-kicker">Article</p>
            <h1 data-site-title>simonc site</h1>
        </div>
    </header>
    <div id="navigation-placeholder"></div>
    <div class="container blog-container">
        <article class="blog-post">
            <div class="article-hero">
                <h1 class="post-title" id="post-title">{{TITLE}}</h1>
            </div>
            <div class="post-layout">
                <aside id="toc-container" class="toc-container" aria-label="Table of contents"></aside>
                <div class="post-main">
                    <div class="post-meta">
                        <div class="post-meta-item"><span class="post-meta-label" data-i18n="created">Created</span><span data-date="{{CREATED}}" data-date-format="medium">{{CREATED}}</span></div>
                        <div class="post-meta-item"><span class="post-meta-label" data-i18n="updated">Updated</span><span data-date="{{UPDATED}}" data-date-format="medium">{{UPDATED}}</span></div>
                        {{LANG_SWITCH}}
                    </div>
                    <div class="post-content">
                        {{CONTENT}}
                    </div>
                    <div class="post-backlinks">
                        <h3 data-i18n="backlinks">Backlinks</h3>
                        <ul id="backlinks-list"></ul>
                    </div>
                    <div class="post-tags">
                        <h3 data-i18n="tags">Tags</h3>
                        {{TAGS}}
                    </div>
                    <div class="post-series">
                        <h3 data-i18n="series">Series</h3>
                        <ul id="series-post-list"></ul>
                    </div>
                </div>
            </div>
        </article>
    </div>
    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> <span data-owner-name>simoncos</span>. All rights reserved.</p>
    </footer>
    <button type="button" id="back-to-top" class="back-to-top hidden" aria-label="Back to top">Back to top</button>
    <div id="progress-container">
        <div id="reading-progress"></div>
    </div>
</body>
</html>
