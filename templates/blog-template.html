<!DOCTYPE html>
<html lang="{{PAGE_LANGUAGE}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-blog-title="{{TITLE_ATTR}} | [site]">{{TITLE}} | simonc site</title>
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta name="author" content="simoncos">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{TITLE_ATTR}}">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:site_name" content="simonc site">
    <meta property="og:locale" content="{{OG_LOCALE}}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{TITLE_ATTR}}">
    <meta name="twitter:description" content="{{META_DESCRIPTION}}">
    <!-- site-shell:resources:start -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
    <link rel="alternate" type="application/rss+xml" title="simonc site RSS (中文)" href="../feed.zh.xml">
    <link rel="alternate" type="application/rss+xml" title="simonc site RSS (English)" href="../feed.en.xml">
    <script src="../src/js/theme-init.js?v=20260711b"></script>
    <link rel="stylesheet" href="../src/css/styles.css?v=20260711e">
    <script src="../src/js/site-config.js?v=20260711b"></script>
    <script src="../src/js/i18n.js?v=20260711b"></script>
    <script src="../src/js/article-groups.js?v=20260711b"></script>
    <script src="../src/js/load-nav.js?v=20260711b"></script>
    <script src="../src/js/dark-mode.js?v=20260711b"></script>
    <script src="../src/js/toc-generator.js?v=20260711b"></script>
    <script src="../src/js/progress-bar.js?v=20260711b"></script>
    <script src="../src/js/back-to-top.js?v=20260711b"></script>
    <script src="../src/js/mobile-scroll-ui.js?v=20260711b"></script>
    <script src="../src/js/footnote-target.js?v=20260711b"></script>
    <script src="../src/js/load-backlinks.js?v=20260711b"></script>
    <script src="https://static.cloudflareinsights.com/beacon.min.js" defer data-cf-beacon="{&quot;token&quot;:&quot;27d42618c53846ada3300ce4fefe0f94&quot;}"></script>
    <script src="../src/js/load-post-series.js?v=20260711b"></script>
    <!-- site-shell:resources:end -->
</head>
<body class="article-page" data-article-group="{{ARTICLE_GROUP_ID}}" data-article-language="{{ARTICLE_LANGUAGE}}" data-article-en-file="{{ARTICLE_EN_FILE}}" data-article-zh-file="{{ARTICLE_ZH_FILE}}">
    <header class="site-header">
        <div class="header-inner">
            <p class="site-kicker" data-i18n="article">Article</p>
            <h1 data-site-title>simonc site</h1>
                    </div>
    </header>
    <div id="navigation-placeholder"></div>
    <div class="container blog-container">
        <article class="blog-post">
            <div class="article-hero">
                <h1 class="post-title" id="post-title">{{TITLE}}</h1>
            </div>
            <div class="post-layout">
                <aside id="toc-container" class="toc-container" aria-label="Table of contents"></aside>
                <div class="post-main">
                    <div class="post-meta">
                        <div class="post-meta-item"><span class="post-meta-label" data-i18n="created">Created</span><span data-date="{{CREATED}}" data-date-format="medium">{{CREATED}}</span></div>
                        <div class="post-meta-item"><span class="post-meta-label" data-i18n="updated">Updated</span><span data-date="{{UPDATED}}" data-date-format="medium">{{UPDATED}}</span></div>
                        {{LANG_SWITCH}}
                    </div>
                    <div class="post-content">
                        {{CONTENT}}
                    </div>
                    <div class="post-backlinks">
                        <h3 data-i18n="backlinks">Backlinks</h3>
                        <ul id="backlinks-list"></ul>
                    </div>
                    <div class="post-tags">
                        <h3 data-i18n="tags">Tags</h3>
                        {{TAGS}}
                    </div>
                    <div class="post-series">
                        <h3 data-i18n="series">Series</h3>
                        <ul id="series-post-list"></ul>
                    </div>
                </div>
            </div>
        </article>
    </div>
    <footer>
        <!-- site-shell:footer:start -->
        <p>&copy; <span data-current-year>2026</span> <span data-owner-name>simoncos</span>. All rights reserved.</p>
        <p><a href="../feed.zh.xml">RSS (中文)</a> · <a href="../feed.en.xml">RSS (English)</a></p>
        <p class="site-version" data-site-version="site-config">talk-2026-05-22-final-6-g538d434</p>
        <!-- site-shell:footer:end -->
    </footer>
    <button type="button" id="back-to-top" class="back-to-top hidden" aria-label="Back to top">Back to top</button>
    <div id="progress-container">
        <div id="reading-progress"></div>
    </div>
</body>
</html>
