<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-blog-title="{{TITLE}} | [owner]'s Blog">{{TITLE}} | simoncos's Blog</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="../src/css/styles.css">
    <script src="../src/js/site-config.js"></script>
    <script src="../src/js/load-nav.js"></script>
    <script src="../src/js/dark-mode.js"></script>
    <script src="../src/js/toc-generator.js"></script>
    <script src="../src/js/progress-bar.js"></script>
    <script src="../src/js/back-to-top.js"></script>
    <script src="../src/js/mobile-scroll-ui.js"></script>
</head>
<body class="article-page">
    <header class="site-header">
        <div class="header-inner">
            <p class="site-kicker">Article</p>
            <h1 data-site-title>simoncos's site</h1>
        </div>
    </header>
    <div id="navigation-placeholder"></div>
    <div class="container blog-container">
        <article class="blog-post">
            <div class="article-hero">
                <h1 class="post-title" id="post-title">{{TITLE}}</h1>
            </div>
            <div class="post-layout">
                <aside id="toc-container" class="toc-container" aria-label="Table of contents"></aside>
                <div class="post-main">
                    <div class="post-meta">
                        <div class="post-meta-item"><span class="post-meta-label">Created</span><span>{{CREATED}}</span></div>
                        <div class="post-meta-item"><span class="post-meta-label">Updated</span><span>{{UPDATED}}</span></div>
                        {{LANG_SWITCH}}
                    </div>
                    <div class="post-content">
                        {{CONTENT}}
                    </div>
                    <div class="post-tags">
                        <h3>Tags:</h3>
                        {{TAGS}}
                    </div>
                    <div class="post-backlinks">
                        <h3>Backlinks:</h3>
                        <ul id="backlinks-list"></ul>
                    </div>
                </div>
            </div>
        </article>
    </div>
    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> <span data-owner-name>simoncos</span>. All rights reserved.</p>
    </footer>
    <button type="button" id="back-to-top" class="back-to-top hidden" aria-label="Back to top">Back to top</button>
    <div id="progress-container">
        <div id="reading-progress"></div>
    </div>
    <script>
        // Script to populate backlinks
        document.addEventListener('DOMContentLoaded', function() {
            var backlinks = JSON.parse('{{BACKLINKS}}');
            var backlinkslist = document.getElementById('backlinks-list');
            if (backlinks.length === 0) {
                backlinkslist.innerHTML = '<li>No backlinks found.</li>';
            } else {
                backlinks.forEach(function(link) {
                    var li = document.createElement('li');
                    var a = document.createElement('a');
                    a.href = link.file;
                    a.textContent = link.title;
                    li.appendChild(a);
                    backlinkslist.appendChild(li);
                });
            }
        });
    </script>
</body>
</html>
