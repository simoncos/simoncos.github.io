name: Site checks

on:
  push:
  pull_request:

# Read-only by default; only the deploy job asks for more.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the trailing comment), so a
# moved or compromised tag cannot change what runs here.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # npm ci installs exactly what package-lock.json records, or fails.
      - name: Install Node dependencies
        run: npm ci

      - name: Run static site checks
        run: make check-all

  # The repository's Pages source is "GitHub Actions" (since 2026-09-29), so
  # this job is the only way master reaches the site, and it runs only after
  # the checks pass. A failed check leaves the last good version live.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The repository root is the site, minus the working files: notes, QA
      # records, generators, tests and TypeScript sources stay in the repo
      # but are not published. Dot-directories are left out as well.
      - name: Stage site
        run: |
          rsync -a ./ _site/ \
            --exclude='.*' --exclude='_site/' --exclude='node_modules/' \
            --exclude='/docs/' --exclude='/tests/' --exclude='/scripts/' \
            --exclude='/templates/' --exclude='/src/ts/' --exclude='/FutureBacklog/' \
            --exclude='/design-qa.md' --exclude='/TODO.md' --exclude='/Makefile' \
            --exclude='/generate_blog_pages.py' --exclude='/package.json' \
            --exclude='/package-lock.json' --exclude='/requirements.txt' \
            --exclude='/vercel.json' --exclude='*.ts' --exclude='*tsconfig.json'

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
