<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Macro Risk Report workflow</title>
  <desc id="desc">An anonymized macro risk report workflow card with public sources, long-running agent research, and human approval.</desc>
  <rect width="640" height="360" fill="#f7f4ef"/>
  <rect x="36" y="34" width="568" height="292" rx="18" fill="#fff" stroke="#d8dbe3"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="66" y="74" fill="#111827" font-size="24" font-weight="700">Macro Risk Report</text>
    <text x="66" y="101" fill="#6b7280" font-size="14">public signals → long-run agent research → human approval</text>
  </g>
  <g transform="translate(66 132)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect width="130" height="88" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
      <text x="18" y="34" fill="#111827" font-size="16" font-weight="700">Public</text>
      <text x="18" y="57" fill="#6b7280" font-size="13">policy / market</text>
      <text x="18" y="75" fill="#6b7280" font-size="13">news / data</text>
    </g>
    <g transform="translate(160 0)">
      <rect width="130" height="88" rx="12" fill="#fff7ed" stroke="#fdba74"/>
      <text x="18" y="34" fill="#9a3412" font-size="16" font-weight="700">Agent</text>
      <text x="18" y="57" fill="#6b7280" font-size="13">scan topics</text>
      <text x="18" y="75" fill="#6b7280" font-size="13">draft pages</text>
    </g>
    <g transform="translate(320 0)">
      <rect width="130" height="88" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="18" y="34" fill="#1d4ed8" font-size="16" font-weight="700">Human</text>
      <text x="18" y="57" fill="#6b7280" font-size="13">select / judge</text>
      <text x="18" y="75" fill="#6b7280" font-size="13">approve</text>
    </g>
  </g>
  <g fill="none" stroke="#9f1239" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M198 176h26"/>
    <path d="M358 176h26"/>
  </g>
  <g fill="#9f1239">
    <path d="M220 168l15 8-15 8z"/>
    <path d="M380 168l15 8-15 8z"/>
  </g>
  <g transform="translate(66 252)" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">
    <text x="0" y="0">Boundary: sensitive charts and final judgment stay with people.</text>
    <rect x="0" y="18" width="508" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="0" y="18" width="355" height="8" rx="4" fill="#9f1239"/>
  </g>
</svg>
