<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="Obsidian vault information architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#eef3f4"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#182033" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#182033" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="760" height="520" rx="30" fill="url(#bg)"/>
  <rect width="760" height="520" rx="30" fill="url(#grid)"/>
  <circle cx="626" cy="92" r="118" fill="#0b7285" opacity="0.10"/>
  <circle cx="150" cy="444" r="118" fill="#1659c5" opacity="0.075"/>

  <!-- abstracted Obsidian sidebar -->
  <g filter="url(#shadow)">
    <rect x="58" y="58" width="214" height="404" rx="24" fill="#182033"/>
    <rect x="82" y="88" width="62" height="8" rx="4" fill="#dfe9ec" opacity=".52"/>
    <rect x="82" y="114" width="152" height="28" rx="8" fill="#ffffff" opacity=".09"/>
    <g font-family="Inter, ui-sans-serif, sans-serif" font-size="16" fill="#dfe9ec" opacity=".92">
      <text x="104" y="136">_media</text>
      <text x="104" y="174">Domain</text>
      <text x="122" y="202" opacity=".64">Finance · Health · PM</text>
      <text x="104" y="242">Knowledge</text>
      <text x="122" y="270" opacity=".64">Concept · People</text>
      <text x="104" y="310">Notes</text>
      <text x="122" y="338" opacity=".64">Weread · Chat · Clips</text>
      <text x="104" y="378">RedPiggy</text>
      <text x="104" y="418">Write · Journal</text>
    </g>
    <g fill="none" stroke="#dfe9ec" stroke-opacity=".45" stroke-width="1.8">
      <path d="M88 128l8 5-8 5"/><path d="M90 169l6 6 6-6"/><path d="M90 237l6 6 6-6"/><path d="M90 305l6 6 6-6"/><path d="M88 373l8 5-8 5"/><path d="M88 412l8 5-8 5"/>
      <path d="M110 182v22M110 250v22M110 318v22" opacity=".32"/>
    </g>
  </g>

  <!-- translation layer -->
  <path d="M272 170C334 170 334 132 396 132" fill="none" stroke="#182033" stroke-opacity=".34" stroke-width="3.7" stroke-linecap="round"/>
  <path d="M272 252C342 252 344 238 396 238" fill="none" stroke="#0b7285" stroke-opacity=".66" stroke-width="3.7" stroke-linecap="round"/>
  <path d="M272 332C338 332 338 352 396 352" fill="none" stroke="#182033" stroke-opacity=".30" stroke-width="3.7" stroke-linecap="round"/>
  <circle cx="396" cy="238" r="8" fill="#0b7285"/>

  <!-- architecture cards -->
  <g font-family="Inter, Noto Sans SC, ui-sans-serif, sans-serif">
    <g filter="url(#shadow)">
      <rect x="396" y="80" width="284" height="86" rx="20" fill="#ffffff" fill-opacity=".68" stroke="#182033" stroke-opacity=".18"/>
      <text x="424" y="116" font-size="17" font-weight="700" fill="#0b7285" letter-spacing="2">INPUTS</text>
      <text x="424" y="143" font-size="21" font-weight="300" fill="#182033">Notes / Clippings / Chat</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="396" y="194" width="284" height="86" rx="20" fill="#ffffff" fill-opacity=".78" stroke="#0b7285" stroke-opacity=".36"/>
      <text x="424" y="230" font-size="17" font-weight="700" fill="#0b7285" letter-spacing="2">KNOWLEDGE</text>
      <text x="424" y="257" font-size="21" font-weight="300" fill="#182033">Concept / People / Projects</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="396" y="308" width="284" height="86" rx="20" fill="#ffffff" fill-opacity=".68" stroke="#182033" stroke-opacity=".18"/>
      <text x="424" y="344" font-size="17" font-weight="700" fill="#1659c5" letter-spacing="2">USE CASES</text>
      <text x="424" y="371" font-size="21" font-weight="300" fill="#182033">Domain / Write / Journal</text>
    </g>
  </g>

  <!-- operating rails -->
  <g fill="none" stroke="#182033" stroke-opacity=".20" stroke-width="2" stroke-linecap="round">
    <path d="M458 418H640"/>
    <path d="M486 442H612"/>
  </g>
  <g font-family="Inter, ui-sans-serif, sans-serif" font-size="15" fill="#3f4b5f">
    <text x="430" y="452">templates · tags · tasks as operating layer</text>
  </g>
</svg>
