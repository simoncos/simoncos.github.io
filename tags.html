<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topics moved to Essays - simonc site</title>
    <meta name="description" content="The topic index is now part of the Essays page.">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://simoncos.github.io/blogs.html">
    <meta http-equiv="refresh" content="0; url=blogs.html#topics">
    <script>
        (function () {
            const target = new URL('blogs.html', window.location.href);
            target.search = window.location.search;
            let legacyTopic = '';
            try {
                legacyTopic = decodeURIComponent(window.location.hash.slice(1));
            } catch (_error) {
                legacyTopic = '';
            }
            target.hash = legacyTopic && legacyTopic !== 'all'
                ? `topic-${encodeURIComponent(legacyTopic)}`
                : 'topics';
            window.location.replace(target.href);
        }());
    </script>
</head>
<body>
    <main>
        <p>The topic index is now part of <a href="blogs.html#topics">Essays</a>.</p>
    </main>
</body>
</html>
